<!-- Feature Icon: Sicurezza Totale -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="secGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9966ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc99ff;stop-opacity:1" />
    </linearGradient>
    <pattern id="wavePattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q5 5, 10 10 T20 10" stroke="#9966ff" stroke-width="1" fill="none" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Scudo -->
  <path d="M100 30 L160 60 L160 110 Q160 150, 100 170 Q40 150, 40 110 L40 60 Z"
        fill="url(#wavePattern)" stroke="url(#secGradient)" stroke-width="4"/>

  <!-- Lucchetto -->
  <rect x="85" y="95" width="30" height="35" rx="3" fill="url(#secGradient)"/>
  <path d="M90 95 L90 80 Q90 70, 100 70 Q110 70, 110 80 L110 95"
        stroke="url(#secGradient)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="100" cy="110" r="4" fill="white"/>
  <line x1="100" y1="114" x2="100" y2="122" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
