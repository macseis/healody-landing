<!-- Category Icon: Relax e Sonno -->
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sleepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2266cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66b2ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Luna crescente -->
  <path d="M30 20 A20 20 0 1 0 30 60 A15 15 0 1 1 30 20"
        fill="url(#sleepGradient)"/>

  <!-- Stelle piccole -->
  <g fill="url(#sleepGradient)">
    <circle cx="55" cy="25" r="2"/>
    <circle cx="60" cy="35" r="1.5"/>
    <circle cx="52" cy="45" r="2"/>
    <circle cx="48" cy="30" r="1"/>
  </g>

  <!-- Onde sonore morbide -->
  <path d="M20 50 Q25 45, 30 50 T40 50" stroke="url(#sleepGradient)"
        stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M15 55 Q20 50, 25 55 T35 55" stroke="url(#sleepGradient)"
        stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
</svg>
