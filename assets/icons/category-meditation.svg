<!-- Category Icon: Meditazione e Focus -->
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="meditationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9966ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc99ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Persona in posizione loto (stilizzata) -->
  <g>
    <!-- Testa -->
    <circle cx="40" cy="25" r="8" fill="url(#meditationGradient)"/>

    <!-- Corpo -->
    <ellipse cx="40" cy="42" rx="10" ry="15" fill="url(#meditationGradient)"/>

    <!-- Gambe incrociate -->
    <ellipse cx="28" cy="52" rx="8" ry="5" fill="url(#meditationGradient)" transform="rotate(-10 28 52)"/>
    <ellipse cx="52" cy="52" rx="8" ry="5" fill="url(#meditationGradient)" transform="rotate(10 52 52)"/>

    <!-- Braccia in posizione meditativa -->
    <ellipse cx="28" cy="42" rx="4" ry="8" fill="url(#meditationGradient)" opacity="0.8"/>
    <ellipse cx="52" cy="42" rx="4" ry="8" fill="url(#meditationGradient)" opacity="0.8"/>
  </g>

  <!-- Aura/chakra centrale -->
  <circle cx="40" cy="35" r="5" fill="none" stroke="url(#meditationGradient)" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Onde concentrate -->
  <path d="M20 35 Q30 32, 35 35" stroke="url(#meditationGradient)"
        stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M60 35 Q50 32, 45 35" stroke="url(#meditationGradient)"
        stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>
