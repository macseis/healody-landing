<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Icona Relax e Sonno - versione con più contrasto -->
  <defs>
    <linearGradient id="sleepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3399ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6666ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Luna crescente - forma più grande e semplice -->
  <path d="M 70 40 A 50 50 0 1 0 70 160 A 40 40 0 1 1 70 40 Z"
        fill="url(#sleepGradient)"
        stroke="#2266cc"
        stroke-width="4"/>

  <!-- Stelle - più grandi e visibili -->
  <g fill="#ffd700" stroke="#cc9900" stroke-width="2">
    <polygon points="130,50 135,65 150,65 138,75 143,90 130,80 117,90 122,75 110,65 125,65" />
    <polygon points="150,110 153,120 163,120 156,126 159,136 150,129 141,136 144,126 137,120 147,120" transform="scale(0.7)" />
    <polygon points="115,140 118,148 126,148 120,153 123,161 115,156 107,161 110,153 104,148 112,148" transform="scale(0.6)" />
  </g>

  <!-- Onde sonore calme -->
  <g opacity="0.6">
    <path d="M 20 100 Q 30 95, 40 100 T 60 100"
          stroke="url(#sleepGradient)"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"/>
    <path d="M 20 110 Q 30 105, 40 110 T 60 110"
          stroke="url(#sleepGradient)"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"/>
  </g>
</svg>
