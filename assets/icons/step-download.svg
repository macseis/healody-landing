<!-- Step Icon: Scarica e Attiva -->
<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3399ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66b2ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Smartphone -->
  <rect x="100" y="50" width="100" height="180" rx="12"
        fill="white" stroke="url(#stepGradient)" stroke-width="4"/>
  <rect x="110" y="70" width="80" height="140" rx="4" fill="#f0f9ff"/>

  <!-- Freccia download grande -->
  <g transform="translate(150, 120)">
    <line x1="0" y1="-25" x2="0" y2="25" stroke="url(#stepGradient)" stroke-width="8" stroke-linecap="round"/>
    <polyline points="-15,10 0,25 15,10" stroke="url(#stepGradient)"
              stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Codice licenza stilizzato -->
  <g transform="translate(150, 250)">
    <rect x="-60" y="-15" width="120" height="30" rx="4" fill="url(#stepGradient)" opacity="0.2"/>
    <text x="0" y="5" font-family="monospace" font-size="16" fill="url(#stepGradient)"
          text-anchor="middle" font-weight="bold">XXXX-XXXX</text>
  </g>

  <!-- Checkmark di successo -->
  <circle cx="200" cy="90" r="20" fill="#10B981"/>
  <polyline points="190,90 196,96 210,82" stroke="white"
            stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
