<!-- Feature Icon: Funziona Ovunque -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="offlineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#33cccc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66dddd;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Contorno smartphone -->
  <rect x="65" y="40" width="70" height="120" rx="8"
        fill="none" stroke="url(#offlineGradient)" stroke-width="4"/>
  <rect x="75" y="50" width="50" height="90" rx="2" fill="#f0f9ff"/>

  <!-- Freccia download -->
  <g transform="translate(100, 60)">
    <line x1="0" y1="-15" x2="0" y2="15" stroke="url(#offlineGradient)" stroke-width="5" stroke-linecap="round"/>
    <polyline points="-10,5 0,15 10,5" stroke="url(#offlineGradient)"
              stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Onde sonore che escono -->
  <path d="M140 80 Q150 80, 155 75" stroke="url(#offlineGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M140 90 Q155 90, 165 85" stroke="url(#offlineGradient)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M140 100 Q150 100, 155 105" stroke="url(#offlineGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <path d="M60 80 Q50 80, 45 75" stroke="url(#offlineGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M60 90 Q45 90, 35 85" stroke="url(#offlineGradient)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M60 100 Q50 100, 45 105" stroke="url(#offlineGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Bottone home -->
  <circle cx="100" cy="150" r="4" fill="url(#offlineGradient)" opacity="0.5"/>
</svg>
