<!-- Feature Icon: Tante Frequenze Terapeutiche -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="freqGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3399ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66b2ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Onde sonore concentriche -->
  <circle cx="100" cy="100" r="15" fill="url(#freqGradient)"/>
  <circle cx="100" cy="100" r="35" stroke="url(#freqGradient)" stroke-width="3" fill="none" opacity="0.8"/>
  <circle cx="100" cy="100" r="55" stroke="url(#freqGradient)" stroke-width="3" fill="none" opacity="0.5"/>
  <circle cx="100" cy="100" r="75" stroke="url(#freqGradient)" stroke-width="3" fill="none" opacity="0.3"/>
</svg>
