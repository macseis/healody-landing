    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-blue-primary: #3399ff;
            --color-blue-light: #66b2ff;
            --color-blue-lighter: #99ccff;
            --color-purple: #9966ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* Animated background circles */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(51, 153, 255, 0.1) 0%, transparent 70%);
            animation: float 20s infinite ease-in-out;
        }

        .bg-circle-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .bg-circle-2 {
            width: 200px;
            height: 200px;
            bottom: 15%;
            right: 15%;
            animation-delay: 5s;
        }

        .bg-circle-3 {
            width: 150px;
            height: 150px;
            top: 50%;
            right: 20%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* Content container */
        .container {
            text-align: center;
            z-index: 10;
            padding: 40px 20px;
            max-width: 800px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            margin-bottom: 50px;
            animation: pulse 3s infinite ease-in-out;
        }

        .logo img {
            max-width: 400px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(51, 153, 255, 0.3));
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Headline */
        .headline {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--color-blue-primary) 0%, var(--color-blue-light) 50%, var(--color-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
            animation: fadeIn 1.5s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Coming Soon Label */
        .coming-soon-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--color-blue-light);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
            animation: fadeIn 1.5s ease-out 0.6s both;
        }

        /* Notify Form */
        .notify-form {
            max-width: 500px;
            margin: 0 auto 40px;
            animation: fadeIn 1.5s ease-out 0.9s both;
        }

        .notify-form p {
            font-size: 1rem;
            color: #b0b0d0;
            margin-bottom: 20px;
        }

        .email-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .email-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid rgba(51, 153, 255, 0.3);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .email-input::placeholder {
            color: #7080a0;
        }

        .email-input:focus {
            border-color: var(--color-blue-primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .notify-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--color-blue-primary) 0%, var(--color-purple) 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .notify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(51, 153, 255, 0.4);
        }

        .form-message {
            font-size: 0.9rem;
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            display: none;
        }

        .form-message.success {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .form-message.error {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }

        /* Social Links */
        .social-links {
            margin-top: 50px;
            animation: fadeIn 1.5s ease-out 1.2s both;
        }

        .social-links p {
            font-size: 0.9rem;
            color: #7080a0;
            margin-bottom: 15px;
        }

        .social-icons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            color: var(--color-blue-light);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background: var(--color-blue-primary);
            color: white;
            transform: translateY(-3px);
        }

        /* Copyright */
        .copyright {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: #7080a0;
            animation: fadeIn 1.5s ease-out 1.5s both;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .headline {
                font-size: 1.8rem;
            }

            .logo img {
                max-width: 300px;
            }

            .email-input-group {
                flex-direction: column;
            }

            .notify-btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .headline {
                font-size: 1.5rem;
            }

            .logo img {
                max-width: 250px;
            }

            .coming-soon-label {
                font-size: 1rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>

    <script>
        // Handle notify form submission
        document.getElementById('notifyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const emailInput = document.getElementById('emailInput');
            const formMessage = document.getElementById('formMessage');
            const email = emailInput.value;

            // Simple validation
            if (!email || !email.includes('@')) {
                formMessage.textContent = 'Inserisci un indirizzo email valido';
                formMessage.className = 'form-message error';
                formMessage.style.display = 'block';
                return;
            }

            // Here you would normally send the email to your backend
            // For now, just show success message
            console.log('Email submitted:', email);

            formMessage.textContent = 'Grazie! Ti avviseremo appena saremo online 🎉';
            formMessage.className = 'form-message success';
            formMessage.style.display = 'block';

            emailInput.value = '';

            // Hide message after 5 seconds
            setTimeout(() => {
                formMessage.style.display = 'none';
            }, 5000);
        });
    </script>
