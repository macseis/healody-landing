<svg width="1510" height="512" viewBox="0 0 1510 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo originale Healody con scritta a destra -->
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3399ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#66b2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#99ccff;stop-opacity:1" />
    </linearGradient>
    <!-- Maschera con S orizzontale usando 2 semicerchi -->
    <mask id="waveMask">
      <circle cx="256" cy="256" r="180" fill="white"/>
      <!-- Primo semicerchio (sinistra) - raggio 110px -->
      <path d="M 37 263 A 110 110 0 0 1 257 263"
            fill="none"
            stroke="black"
            stroke-width="80"
            stroke-linecap="round"/>
      <!-- Secondo semicerchio (destra) - raggio 110px -->
      <path d="M 255 249 A 110 110 0 0 0 475 249"
            fill="none"
            stroke="black"
            stroke-width="80"
            stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Logo originale -->
  <g>
    <!-- Cerchio esterno -->
    <circle cx="256" cy="256" r="240" fill="none" stroke="url(#waveGradient)" stroke-width="28" opacity="0.85"/>

    <!-- Cerchio interno con S ruotato -20° (antiorario) -->
    <g transform="rotate(-20 256 256)">
      <circle cx="256" cy="256" r="180" fill="url(#waveGradient)" opacity="0.95" mask="url(#waveMask)"/>
    </g>
  </g>

  <!-- Scritta Healody a destra del logo -->
  <!-- Allineato in basso al fondo del cerchio interno (256 + 180 = 436) -->
  <!-- Font size ingrandito a 260px -->
  <g>
    <text x="550" y="436"
          font-family="Arial, Helvetica, sans-serif"
          font-size="260"
          font-weight="700"
          letter-spacing="-8"
          fill="url(#waveGradient)">Healody</text>
  </g>
</svg>
